<text x="24" y="40" font-size="13" fill="#ffffff60">$ cat ~/about</text>
<text x="24" y="78" font-size="26" font-weight="700" fill="#ffffffcf">Linux Systems &amp;</text>
<text x="24" y="110" font-size="26" font-weight="700" fill="#ffffffcf">Binary Analysis</text>
<text x="24" y="140" font-size="14" fill="#ffffff80">Computer Engineering</text>
<text x="24" y="176" font-size="14" fill="#ffffffa0">I live in a terminal on Void Linux:</text>
<text x="24" y="197" font-size="14" fill="#ffffffa0">runit, ZFS, a patched dwm and a</text>
<text x="24" y="218" font-size="14" fill="#ffffffa0">monochrome LazyVim. Mostly I take</text>
<text x="24" y="239" font-size="14" fill="#ffffffa0">binaries apart: crackmes, stripped ELFs,</text>
<text x="24" y="260" font-size="14" fill="#ffffffa0">anything that ships without source. The</text>
