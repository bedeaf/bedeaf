<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
<style>
:root{--bg:#ffffff;--win:#fafafa;--bar:#f0f0f0;--line:#d4d4d4;--fg:#111111;--dim:#8a8a8a;--grid:#ececec}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--win:#111418;--bar:#1a1d22;--line:#30363d;--fg:#f0f0f0;--dim:#7d8590;--grid:#161b22}}
.bg{fill:var(--bg)}.win{fill:var(--win);stroke:var(--line)}.bar{fill:var(--bar)}
.dot{fill:none;stroke:var(--dim)}.t{fill:var(--fg);font-size:15px}.d{fill:var(--dim);font-size:15px}
.title{fill:var(--dim);font-size:12px;letter-spacing:1px}
.big{fill:var(--fg);font-size:34px;font-weight:700;letter-spacing:6px}
.cell{fill:var(--grid)}
.ln{clip-path:inset(0 100% 0 0);animation:type 1.1s steps(28,end) forwards}
.l1{animation-delay:.3s}.l2{animation-delay:1.6s}.l3{animation-delay:2.9s}.l4{animation-delay:4.2s}.l5{animation-delay:5.5s}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
.cur{fill:var(--fg);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.scan{fill:var(--fg);opacity:.04;animation:scan 6s linear infinite}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(230px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{fill:var(--grid)}50%{fill:var(--dim)}}
@media(prefers-reduced-motion:reduce){.ln{animation:none;clip-path:none}.scan,.pulse,.cur{animation:none}}
</style>
