<text x="24" y="42" font-size="15" fill="#ffffff70">$ cat ~/about</text>
<text x="24" y="82" font-size="28" font-weight="700" fill="#ffffffcf">Linux Systems &amp;</text>
<text x="24" y="116" font-size="28" font-weight="700" fill="#ffffffcf">Binary Analysis</text>
<text x="24" y="148" font-size="16" fill="#ffffff8f">Computer Engineering</text>
<text x="24" y="188" font-size="16" fill="#ffffffa0">I live in a terminal on Void Linux:</text>
<text x="24" y="212" font-size="16" fill="#ffffffa0">runit, ZFS, a patched dwm and a</text>
<text x="24" y="236" font-size="16" fill="#ffffffa0">monochrome LazyVim. Mostly I take</text>
<text x="24" y="260" font-size="16" fill="#ffffffa0">binaries apart: crackmes, stripped</text>
<text x="24" y="284" font-size="16" fill="#ffffffa0">ELFs, anything that ships without</text>
<text x="24" y="308" font-size="16" fill="#ffffffa0">source. The tools I need, I write in</text>
<text x="24" y="332" font-size="16" fill="#ffffffa0">C/C++.</text><rect x="24" y="358" width="50" height="26" fill="#ffffff20"/><text x="32" y="376" font-size="14" fill="#ffffffa0">void</text><rect x="80" y="358" width="58" height="26" fill="#ffffff20"/><text x="88" y="376" font-size="14" fill="#ffffffa0">runit</text><rect x="144" y="358" width="41" height="26" fill="#ffffff20"/><text x="152" y="376" font-size="14" fill="#ffffffa0">zfs</text><rect x="191" y="358" width="41" height="26" fill="#ffffff20"/><text x="199" y="376" font-size="14" fill="#ffffffa0">dwm</text><rect x="238" y="358" width="66" height="26" fill="#ffffff20"/><text x="246" y="376" font-size="14" fill="#ffffffa0">neovim</text><rect x="310" y="358" width="58" height="26" fill="#ffffff20"/><text x="318" y="376" font-size="14" fill="#ffffffa0">urxvt</text><rect x="24" y="391" width="24" height="26" fill="#ffffff40"/><text x="32" y="409" font-size="14" fill="#ffffffcf">C</text><rect x="54" y="391" width="41" height="26" fill="#ffffff40"/><text x="62" y="409" font-size="14" fill="#ffffffcf">C++</text><rect x="102" y="391" width="33" height="26" fill="#ffffff40"/><text x="110" y="409" font-size="14" fill="#ffffffcf">Go</text><rect x="140" y="391" width="41" height="26" fill="#ffffff40"/><text x="148" y="409" font-size="14" fill="#ffffffcf">Lua</text><rect x="24" y="424" width="100" height="26" fill="#ffffff17"/><text x="32" y="442" font-size="14" fill="#ffffffa0">reversing:</text><rect x="130" y="424" width="75" height="26" fill="#ffffff17"/><text x="138" y="442" font-size="14" fill="#ffffffa0">radare2</text><rect x="211" y="424" width="117" height="26" fill="#ffffff17"/><text x="219" y="442" font-size="14" fill="#ffffffa0">binary ninja</text>
