name: snake
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write}
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#cfcfcf&color_dots=#101010,#303030,#606060,#909090,#dfdfdf
      - name: transparent dark and light copies (same recolor as the panels)
        run: |
          sudo python3 tools/theme.py dist/snake.svg dist/snake-dark.svg dist/snake-light.svg
          sudo rm dist/snake.svg
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
