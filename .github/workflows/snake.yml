name: snake
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write}
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#111111&color_dots=#f2f2f2,#d0d0d0,#a0a0a0,#606060,#1a1a1a
            dist/snake-dark.svg?palette=github-dark&color_snake=#f5f5f5&color_dots=#161b22,#3a3a3a,#6a6a6a,#a8a8a8,#f0f0f0
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
