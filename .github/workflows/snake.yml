name: snake
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write}
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#cfcfcf&color_dots=#101010,#303030,#606060,#909090,#dfdfdf
      - name: paint black panel behind the grid
        run: |
          sudo sed -i -E '0,/<svg[^>]*>/s//&<rect x="-100%" y="-100%" width="300%" height="300%" fill="#000"\/>/' dist/snake.svg
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
